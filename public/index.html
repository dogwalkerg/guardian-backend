<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guardian 云端控制后台</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#172033;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-size:19px;font-weight:700}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #e6eaf2;border-radius:12px;padding:20px;box-shadow:0 4px 18px #1720330a;margin-bottom:18px}h2{margin:0 0 16px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.metric{padding:16px;border-radius:10px;background:#f6f8fc}.metric strong{display:block;font-size:26px;margin-top:6px}.form{display:flex;gap:10px;flex-wrap:wrap}.form input,.form button{height:38px;border:1px solid #d6dce8;border-radius:8px;padding:0 12px;font-size:14px}.form button{background:#2563eb;color:white;border:none;cursor:pointer}.form button.secondary{background:#64748b}.muted{color:#6b7280;font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #edf0f5;padding:12px 8px;font-size:14px}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;background:#fee2e2;color:#991b1b}.online{background:#dcfce7;color:#166534}.hidden{display:none}.msg{margin-top:12px;color:#b91c1c}.token{word-break:break-all;background:#f8fafc;padding:10px;border-radius:8px}
</style>
</head>
<body>
<header class="top"><div class="brand">Guardian 云端控制后台</div><div id="sessionText" class="muted" style="color:#cbd5e1">未登录</div></header>
<main class="wrap">
<section id="loginCard" class="card"><h2>家长账号登录</h2><div class="form"><input id="phone" placeholder="手机号" autocomplete="tel"><input id="captcha" placeholder="验证码"><button id="send">发送验证码</button><button id="login">登录</button></div><div id="loginMsg" class="msg"></div><p class="muted">开发环境可使用服务端返回的 devCode；生产环境需接入短信服务。</p></section>
<section id="dashboard" class="hidden">
<div class="grid"><div class="metric">家庭成员<strong id="familyName">-</strong></div><div class="metric">孩子数量<strong id="childCount">0</strong></div><div class="metric">在线设备<strong id="onlineCount">0</strong></div><div class="metric">最近刷新<strong id="updatedAt">-</strong></div></div>
<section class="card"><h2>设备概览 <button class="form button" id="refresh" style="float:right;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer">刷新</button></h2><table class="table"><thead><tr><th>孩子</th><th>设备</th><th>系统</th><th>在线</th><th>电量</th><th>最后在线</th></tr></thead><tbody id="deviceRows"></tbody></table></section>
<section class="card"><h2>创建绑定码</h2><button id="bind" class="form" style="background:#0f766e;color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer">生成绑定码</button><div id="bindResult" class="token hidden"></div></section>
<section class="card"><h2>接口地址</h2><div class="muted">HTTPS API：<span id="apiBase"></span></div><div class="muted">WebSocket：<span id="wsBase"></span></div></section>
</section></main>
<script>
const api=location.origin; let token=localStorage.getItem('guardian_token');
const $=id=>document.getElementById(id); const show=(id,on=true)=>$(id).classList.toggle('hidden',!on);
async function req(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(api+path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||j.error||'请求失败');return j}
async function sendCaptcha(){try{const j=await req('/api/v1/auth/account/sendCaptcha',{method:'POST',body:JSON.stringify({phone:$('phone').value})});$('loginMsg').textContent=j.data?.devCode?'验证码：'+j.data.devCode:'验证码已发送';}catch(e){$('loginMsg').textContent=e.message}}
async function login(){try{const j=await req('/api/v1/auth/account/captchaLogin',{method:'POST',body:JSON.stringify({phone:$('phone').value,code:$('captcha').value})});token=j.token||j.data?.token;localStorage.setItem('guardian_token',token);await load();}catch(e){$('loginMsg').textContent=e.message}}
async function load(){try{const u=await req('/api/v1/parent/user/getUserInfo');const c=await req('/api/v1/parent/index/childUserList');$('familyName').textContent=u.data?.familyName||'我的家庭';const rows=c.data||[];$('childCount').textContent=rows.length;$('onlineCount').textContent=rows.filter(x=>x.online).length;$('updatedAt').textContent=new Date().toLocaleString();$('sessionText').textContent='已登录：'+(u.data?.phone||'');$('deviceRows').innerHTML=rows.map(x=>`<tr><td>${x.name||'-'}</td><td>${x.phoneName||x.model||'-'}</td><td>${x.androidVersion||'-'}</td><td><span class="badge ${x.online?'online':''}">${x.online?'在线':'离线'}</span></td><td>${x.battery==null?'-':x.battery+'%'}</td><td>${x.lastSeenAt?new Date(x.lastSeenAt).toLocaleString():'-'}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">暂无已绑定设备</td></tr>';show('loginCard',false);show('dashboard',true)}catch(e){localStorage.removeItem('guardian_token');token=null;show('loginCard',true);$('loginMsg').textContent='请登录：'+e.message}}
$('send').onclick=sendCaptcha;$('login').onclick=login;$('refresh').onclick=load;$('bind').onclick=async()=>{try{const j=await req('/api/v1/parent/account/getBindQrcode');$('bindResult').textContent='绑定码：'+j.data.bindCode+'\n二维码内容：'+j.data.content+'\n有效期：'+j.data.expiresIn+' 秒';show('bindResult')}catch(e){$('bindResult').textContent=e.message;show('bindResult')}};$('apiBase').textContent=location.origin+'/api';$('wsBase').textContent=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws';if(token)load();
</script>
</body></html>
