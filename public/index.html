<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guardian 管理员控制台</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa;--nav:#172033;--blue:#2563eb;--line:#e4e8f0;--muted:#64748b;--green:#15803d;--red:#b91c1c}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{height:64px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:750}.top-right{display:flex;align-items:center;gap:14px;font-size:13px;color:#cbd5e1}.top button{background:#334155;color:#fff;border-radius:7px;padding:8px 11px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 64px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.nav{width:100%;text-align:left;background:transparent;color:#475569;padding:11px 13px;border-radius:7px;margin-bottom:4px}.nav:hover,.nav.active{background:#e8efff;color:#1d4ed8;font-weight:650}.main{max-width:1500px;width:100%;padding:26px clamp(16px,3vw,38px);margin:auto}.view{display:none}.view.active{display:block}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.head h1{font-size:24px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{background:var(--blue);color:#fff;border-radius:7px;padding:9px 13px;font-size:13px}.btn.secondary{background:#e9eef7;color:#334155}.btn.success{background:#15803d}.btn.danger{background:#b91c1c}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:12px;margin-bottom:20px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:8px}.metric{padding:16px}.metric span{font-size:13px;color:var(--muted)}.metric strong{display:block;font-size:28px;margin-top:8px}.panel{padding:18px;margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 14px}.panel h3{font-size:14px;margin:20px 0 10px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;border-bottom:1px solid #edf0f5;padding:11px 8px;font-size:13px;vertical-align:top}.table th{color:#64748b;font-weight:600;white-space:nowrap}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;background:#fee2e2;color:#991b1b;white-space:nowrap}.badge.online{background:#dcfce7;color:#166534}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{color:#475569;font-size:12px}.field input,.field select,.field textarea,.search{border:1px solid #d5dce8;border-radius:6px;padding:9px 10px;background:#fff;color:#172033;min-width:0}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.list{display:grid;gap:8px}.list-item{border:1px solid var(--line);border-radius:7px;padding:11px;background:#fbfcfe}.list-item strong{font-size:13px}.list-item .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:5px}.empty{text-align:center;color:var(--muted);padding:26px}.notice{padding:10px 12px;border-radius:6px;background:#eff6ff;color:#1e40af;font-size:13px;margin-bottom:14px}.error{color:var(--red);font-size:13px;margin-top:9px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#eef2f8}.login-box{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px;box-shadow:0 12px 40px #17203312}.login-box h1{font-size:22px;margin:0 0 6px}.login-box .field{margin-top:15px}.login-box .btn{width:100%;margin-top:18px}.hidden{display:none!important}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:9px}.kvs{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px}.kv{padding:11px;background:#f8fafc;border-radius:6px}.kv span{display:block;color:var(--muted);font-size:12px}.kv strong{display:block;margin-top:4px;font-size:14px;overflow-wrap:anywhere}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.shell{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{width:auto;white-space:nowrap;margin:0 4px 0 0}.split{grid-template-columns:1fr}.kvs{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{padding:0 14px}.main{padding:18px 12px}.grid{grid-template-columns:repeat(2,1fr)}.metric strong{font-size:23px}.form-grid{grid-template-columns:1fr}.head{display:block}.toolbar{margin-top:12px}.panel{padding:14px}}
</style>
</head>
<body>
<section id="loginView" class="login"><div class="login-box"><h1>Guardian 管理员控制台</h1><div class="muted">管理员登录后管理家庭、孩子设备和版本更新</div><div class="field"><label for="username">管理员账号</label><input id="username" autocomplete="username"></div><div class="field"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn">登录</button><div id="loginError" class="error"></div></div></section>
<section id="appView" class="hidden"><header class="top"><div class="brand">Guardian 管理员控制台</div><div class="top-right"><span id="sessionUser"></span><button id="logoutBtn">退出登录</button></div></header><div class="shell"><aside class="side"><button class="nav active" data-view="overview">总览</button><button class="nav" data-view="families">家庭与家长</button><button class="nav" data-view="devices">孩子设备</button><button class="nav" data-view="version">系统版本</button><button class="nav" data-view="logs">操作日志</button></aside><main class="main">
<section id="view-overview" class="view active"><div class="head"><div><h1>运行总览</h1><div class="muted">设备状态、最近心跳和控制结果均来自客户端上报</div></div><div class="toolbar"><button id="refreshBtn" class="btn secondary">刷新</button></div></div><div id="metrics" class="grid"></div><div class="panel"><h2>设备状态</h2><div id="overviewDevices" class="table-wrap"></div></div><div class="panel"><h2>最近设备事件</h2><div id="overviewEvents" class="table-wrap"></div></div></section>
<section id="view-families" class="view"><div class="head"><div><h1>家庭与家长</h1><div class="muted">查看绑定关系和家庭内设备数量</div></div><div class="toolbar"><input id="familySearch" class="search" placeholder="搜索家庭或手机号"><button id="familySearchBtn" class="btn">查询</button></div></div><div class="panel"><div id="familiesTable" class="table-wrap"></div></div></section>
<section id="view-devices" class="view"><div class="head"><div><h1>孩子设备</h1><div class="muted">选择孩子后查看数据并执行设备控制</div></div><button id="reloadDevicesBtn" class="btn secondary">刷新</button></div><div class="panel"><div id="devicesTable" class="table-wrap"></div></div><div id="childDetail" class="hidden"></div></section>
<section id="view-version" class="view"><div class="head"><div><h1>系统版本</h1><div class="muted">发布新镜像后，后台请求宿主机 updater 拉取并重启服务</div></div><div class="toolbar"><button id="checkVersionBtn" class="btn secondary">检查更新</button><button id="updateBtn" class="btn success">一键更新</button></div></div><div id="versionPanel" class="panel"></div><div class="panel"><h2>可回滚版本</h2><div id="releasesTable" class="table-wrap"></div></div><div id="updateMessage"></div></section>
<section id="view-logs" class="view"><div class="head"><div><h1>操作日志</h1><div class="muted">管理员操作与设备事件的审计记录</div></div><button id="reloadLogsBtn" class="btn secondary">刷新</button></div><div class="panel"><h2>管理员操作</h2><div id="adminLogs" class="table-wrap"></div></div></section>
</main></div></section>
<script>
const api=location.origin;let token=localStorage.getItem('guardian_admin_token');let overview=null;let selectedChild=null;let versionInfo=null;const $=id=>document.getElementById(id);const esc=value=>String(value??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=value=>value?new Date(value).toLocaleString():'-';const badge=(online,label)=>`<span class="badge ${online?'online':''}">${esc(label??(online?'在线':'离线'))}</span>`;
async function req(path,opt={}){const headers={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})};const r=await fetch(api+path,{...opt,headers});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||j.error||`请求失败(${r.status})`);return j}
function showLogin(){ $('loginView').classList.remove('hidden');$('appView').classList.add('hidden') }function showApp(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden') }
async function login(){try{const j=await req('/api/v1/admin/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=j.token||j.data?.token;localStorage.setItem('guardian_admin_token',token);$('sessionUser').textContent=j.data?.username||$('username').value;showApp();await loadOverview()}catch(e){$('loginError').textContent=e.message}}
function metric(label,value){return `<div class="metric"><span>${label}</span><strong>${esc(value??0)}</strong></div>`}
async function loadOverview(){try{const j=await req('/api/v1/admin/overview');overview=j.data;const d=overview; $('metrics').innerHTML=[metric('家庭数',d.families),metric('家长数',d.parents),metric('孩子数',d.children),metric('设备数',d.devices),metric('在线设备',d.online_devices),metric('离线设备',d.offline_devices)].join('');$('overviewDevices').innerHTML=deviceTable(d.devices||[]);$('overviewEvents').innerHTML=eventTable(d.recentEvents||[])}catch(e){if(e.message.includes('登录')){token=null;localStorage.removeItem('guardian_admin_token');showLogin()}else alert(e.message)}}
function deviceTable(items){if(!items.length)return '<div class="empty">暂无设备数据</div>';return `<table class="table"><thead><tr><th>孩子/家庭</th><th>设备</th><th>状态</th><th>电量/网络</th><th>当前应用</th><th>最后心跳</th><th></th></tr></thead><tbody>${items.map(d=>`<tr><td><strong>${esc(d.childName)}</strong><div class="muted">${esc(d.familyName)}</div></td><td>${esc([d.deviceName,d.brand,d.model].filter(Boolean).join(' / '))}<div class="muted">Android ${esc(d.androidVersion)} · 客户端 ${esc(d.clientVersion)}</div></td><td>${badge(d.online)}<div class="muted">${esc(d.controlStatus||'normal')}</div></td><td>${d.battery==null?'-':esc(d.battery)+'%'} / ${esc(d.networkType)}</td><td>${esc(d.currentAppName||d.currentAppPackage||'-')}</td><td>${fmt(d.lastHeartbeatAt||d.lastSeenAt)}</td><td><button class="btn secondary" onclick="openChild('${esc(d.childId)}')">查看</button></td></tr>`).join('')}</tbody></table>`}
function eventTable(items){if(!items.length)return '<div class="empty">暂无事件</div>';return `<table class="table"><thead><tr><th>时间</th><th>事件</th><th>内容</th></tr></thead><tbody>${items.map(e=>`<tr><td>${fmt(e.createdAt)}</td><td>${esc(e.eventType)}</td><td><div class="code">${esc(JSON.stringify(e.payload||{}))}</div></td></tr>`).join('')}</tbody></table>`}
async function loadFamilies(){const j=await req('/api/v1/admin/families?search='+encodeURIComponent($('familySearch').value||''));const rows=j.data||[];$('familiesTable').innerHTML=rows.length?`<table class="table"><thead><tr><th>家庭</th><th>家长</th><th>孩子数</th><th>在线设备</th><th>创建时间</th><th></th></tr></thead><tbody>${rows.map(f=>`<tr><td>${esc(f.familyName)}</td><td>${esc(f.displayName||'-')}<div class="muted">${esc(f.phone)}</div></td><td>${esc(f.childCount)}</td><td>${esc(f.onlineDevices)}</td><td>${fmt(f.createdAt)}</td><td><button class="btn secondary" onclick="openFamily('${esc(f.familyId)}')">详情</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无家庭</div>'}
async function loadDevices(){if(!overview)await loadOverview();$('devicesTable').innerHTML=deviceTable(overview?.devices||[]);}
function kv(label,value){return `<div class="kv"><span>${label}</span><strong>${esc(value??'-')}</strong></div>`}
async function openChild(childId){try{const j=await req('/api/v1/admin/children/'+encodeURIComponent(childId));selectedChild=j.data;renderChildDetail()}catch(e){alert(e.message)}}
function renderChildDetail(){const d=selectedChild;const c=d.child;const p=d.policy||{};const s=d.settings||{};$('childDetail').classList.remove('hidden');$('childDetail').innerHTML=`<div class="head"><div><h1>${esc(c.name)} <span class="muted">${esc(c.parentPhone||'')}</span></h1><div class="muted">家庭：${esc(c.familyName)} · 设备：${esc(c.device_name||c.model||'-')}</div></div><button class="btn secondary" onclick="$('childDetail').classList.add('hidden')">收起</button></div><div class="panel"><div class="kvs">${kv('连接状态',c.online?'在线':'离线')}${kv('电量',c.battery==null?'-':c.battery+'%')}${kv('网络',c.network_type)}${kv('系统',c.android_version)}${kv('客户端',c.client_version)}${kv('当前应用',c.current_app_name||c.current_app_package)}${kv('步数',c.step_count)}${kv('最后心跳',fmt(c.last_heartbeat_at))}</div><div class="actions"><button class="btn danger" onclick="childAction('lock')">锁屏</button><button class="btn success" onclick="childAction('unlock')">解除锁屏</button><button class="btn" onclick="childAction('request-location')">请求定位</button><button class="btn secondary" onclick="childAction('sync-apps')">同步应用</button><button class="btn secondary" onclick="childAction('sync-usage')">同步使用记录</button><button class="btn danger" onclick="childAction('unbind')">解绑设备</button></div><div id="childActionMsg" class="muted"></div></div><div class="split"><div class="panel"><h2>时间与管控策略</h2><div class="form-grid"><div class="field"><label>策略名称</label><input id="policyName" value="${esc(p.name||'默认管控策略')}"></div><div class="field"><label>每日上限（秒）</label><input id="dailyLimit" type="number" min="0" value="${esc(p.daily_limit_seconds??'')}"></div><div class="field"><label>时区</label><input id="timezone" value="${esc(p.timezone||'Asia/Shanghai')}"></div></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>启用策略</label><select id="policyEnabled"><option value="true" ${p.enabled!==false?'selected':''}>是</option><option value="false" ${p.enabled===false?'selected':''}>否</option></select></div><div class="field"><label>禁玩模式</label><select id="noPlay"><option value="false" ${!p.no_play_enabled?'selected':''}>关闭</option><option value="true" ${p.no_play_enabled?'selected':''}>开启</option></select></div><div class="field"><label>允许通话</label><select id="allowCall"><option value="true" ${p.allow_call!==false?'selected':''}>允许</option><option value="false" ${p.allow_call===false?'selected':''}>禁止</option></select></div></div><div class="field" style="margin-top:12px"><label>时间段 JSON</label><textarea id="periods">${esc(JSON.stringify(p.periods||[],null,2))}</textarea></div><button class="btn" onclick="savePolicy()">保存并下发策略</button><div id="policyMsg" class="muted"></div></div><div class="panel"><h2>设备功能开关</h2><div class="form-grid"><div class="field"><label>允许新安装应用</label><select id="allowNew"><option value="true" ${s.allow_new_apps!==false?'selected':''}>允许</option><option value="false" ${s.allow_new_apps===false?'selected':''}>禁止</option></select></div><div class="field"><label>定位</label><select id="locationEnabled"><option value="true" ${s.location_enabled!==false?'selected':''}>开启</option><option value="false" ${s.location_enabled===false?'selected':''}>关闭</option></select></div><div class="field"><label>自动定位</label><select id="autoLocation"><option value="true" ${s.automatic_location_enabled!==false?'selected':''}>开启</option><option value="false" ${s.automatic_location_enabled===false?'selected':''}>关闭</option></select></div><div class="field"><label>热点</label><select id="hotspot"><option value="true" ${s.hotspot_enabled!==false?'selected':''}>允许</option><option value="false" ${s.hotspot_enabled===false?'selected':''}>禁止</option></select></div><div class="field"><label>离线策略</label><select id="offlineMode"><option value="allow" ${s.offline_mode!=='deny'?'selected':''}>允许使用</option><option value="deny" ${s.offline_mode==='deny'?'selected':''}>离线禁止</option></select></div></div><button class="btn" onclick="saveSettings()">保存并下发设置</button><div id="settingsMsg" class="muted"></div></div></div><div class="panel"><h2>已安装应用与单独策略</h2><div class="table-wrap"><table class="table"><thead><tr><th>应用</th><th>版本</th><th>类型</th><th>策略</th><th>每日上限</th><th></th></tr></thead><tbody>${(d.apps||[]).map(a=>`<tr><td><strong>${esc(a.appName)}</strong><div class="muted">${esc(a.packageName)}</div></td><td>${esc(a.versionName||'-')} (${esc(a.versionCode||'-')})</td><td>${a.isSystem?'系统':'用户'}</td><td><select id="type-${esc(a.packageName)}"><option value="1" ${a.policyType==1||!a.policyType?'selected':''}>允许</option><option value="2" ${a.policyType==2?'selected':''}>限时</option><option value="3" ${a.policyType==3?'selected':''}>禁止</option></select></td><td><input id="limit-${esc(a.packageName)}" type="number" min="0" value="${esc(a.dailyLimitSeconds??'')}" style="width:100px"></td><td><button class="btn" onclick="saveAppPolicy('${esc(a.packageName)}','${esc(a.appName)}')">保存</button> <button class="btn danger" onclick="uninstallApp('${esc(a.packageName)}','${esc(a.appName)}')">卸载</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">设备尚未同步应用列表</td></tr>'}</tbody></table></div></div><div class="split"><div class="panel"><h2>位置记录</h2>${(d.locationHistory||[]).length?`<div class="list">${d.locationHistory.slice(0,20).map(l=>`<div class="list-item"><strong>${esc(l.latitude)}, ${esc(l.longitude)}</strong><div class="meta"><span>${fmt(l.recordedAt)}</span><span>精度 ${esc(l.accuracy||'-')}m</span><span>${esc(l.address||l.source||'')}</span></div></div>`).join('')}</div>`:'<div class="empty">暂无定位记录</div>'}</div><div class="panel"><h2>使用统计</h2>${(d.usage||[]).length?`<div class="list">${d.usage.slice(0,20).map(u=>`<div class="list-item"><strong>${esc(u.appName||u.packageName)}</strong><div class="meta"><span>${esc(u.useSeconds)} 秒</span><span>${esc(u.day)}</span></div></div>`).join('')}</div>`:'<div class="empty">暂无使用记录</div>'}</div></div><div class="panel"><h2>命令队列与回执</h2>${commandTable(d.commands||[])}</div><div class="panel"><h2>设备事件</h2>${eventTable(d.events||[])}</div>`}
function commandTable(items){if(!items.length)return '<div class="empty">暂无命令</div>';return `<table class="table"><thead><tr><th>创建时间</th><th>命令</th><th>状态</th><th>发送/回执</th><th>结果</th></tr></thead><tbody>${items.map(c=>`<tr><td>${fmt(c.createdAt)}</td><td>${esc(c.command)}<div class="muted">${esc(c.id)}</div></td><td>${badge(c.status==='succeeded',c.status)}</td><td>${fmt(c.sentAt)}<br>${fmt(c.acknowledgedAt)}</td><td><div class="code">${esc(JSON.stringify(c.result||{}))}</div></td></tr>`).join('')}</tbody></table>`}
async function childAction(action){try{const j=await req(`/api/v1/admin/children/${selectedChild.child.childId}/${action}`,{method:'POST',body:'{}'});$('childActionMsg').textContent=`已提交：${j.data.status}（${j.data.commandId||'-'}）`;await openChild(selectedChild.child.childId)}catch(e){$('childActionMsg').textContent=e.message}}
async function savePolicy(){try{let periods=[];try{periods=JSON.parse($('periods').value||'[]')}catch{throw Error('时间段 JSON 格式错误')}const body={name:$('policyName').value,enabled:$('policyEnabled').value==='true',noPlayEnabled:$('noPlay').value==='true',allowCall:$('allowCall').value==='true',dailyLimitSeconds:Number($('dailyLimit').value)||null,timezone:$('timezone').value,periods};const j=await req(`/api/v1/admin/children/${selectedChild.child.childId}/policy`,{method:'PUT',body:JSON.stringify(body)});$('policyMsg').textContent=`已保存，命令状态：${j.data.command?.status||'queued'}`;await openChild(selectedChild.child.childId)}catch(e){$('policyMsg').textContent=e.message}}
async function saveSettings(){try{const body={allowNewApps:$('allowNew').value==='true',locationEnabled:$('locationEnabled').value==='true',automaticLocationEnabled:$('autoLocation').value==='true',hotspotEnabled:$('hotspot').value==='true',offlineMode:$('offlineMode').value};const j=await req(`/api/v1/admin/children/${selectedChild.child.childId}/app-settings`,{method:'PUT',body:JSON.stringify(body)});$('settingsMsg').textContent=`已保存，命令状态：${j.data.command?.status||'queued'}`;await openChild(selectedChild.child.childId)}catch(e){$('settingsMsg').textContent=e.message}}
function appNameFor(packageName){return selectedChild?.apps?.find(x=>x.packageName===packageName)?.appName||packageName}
async function saveAppPolicy(packageName){const appName=appNameFor(packageName);try{const body={packageName,appName,policyType:Number($('type-'+packageName).value),dailyLimitSeconds:Number($('limit-'+packageName).value)||null};const j=await req(`/api/v1/admin/children/${selectedChild.child.childId}/app-policies`,{method:'PUT',body:JSON.stringify(body)});alert(`已保存，命令状态：${j.data.command?.status||'queued'}`);await openChild(selectedChild.child.childId)}catch(e){alert(e.message)}}
async function uninstallApp(packageName){const appName=appNameFor(packageName);if(!confirm(`确认向设备下发卸载 ${appName||packageName}？`))return;try{const j=await req(`/api/v1/admin/children/${selectedChild.child.childId}/uninstall`,{method:'POST',body:JSON.stringify({packageName,appName})});alert(`卸载命令：${j.data.status}`);await openChild(selectedChild.child.childId)}catch(e){alert(e.message)}}
const originalRenderChildDetail=renderChildDetail;renderChildDetail=function(){originalRenderChildDetail();const d=selectedChild,s=d.settings||{},c=d.child||{};const owner=c.deviceOwnerEnabled?'已启用':'未启用';$('childDetail').insertAdjacentHTML('beforeend',`<div class="panel"><h2>Device Owner / DPM 状态与限制</h2><div class="kvs">${kv('Device Owner',owner)}${kv('DPM API',c.dpmApiLevel||'-')}${kv('管理包名',c.deviceOwnerPackage||'-')}${kv('最近同步',fmt(c.dpmLastSyncAt))}</div><div class="form-grid" style="margin-top:12px"><div class="field"><label>显示应用管理</label><select id="showAppManagement"><option value="true" ${s.show_app_management!==false?'selected':''}>显示</option><option value="false" ${s.show_app_management===false?'selected':''}>隐藏</option></select></div><div class="field"><label>禁止系统重置</label><select id="resetDisabled"><option value="true" ${s.reset_disabled?'selected':''}>禁止</option><option value="false" ${!s.reset_disabled?'selected':''}>允许</option></select></div><div class="field"><label>离线锁屏天数</label><input id="offlineLockAfterDays" type="number" min="0" value="${esc(s.offline_lock_after_days??'')}"></div><div class="field"><label>允许电话</label><select id="allowPhone"><option value="true" ${s.allow_phone!==false?'selected':''}>允许</option><option value="false" ${s.allow_phone===false?'selected':''}>禁止</option></select></div><div class="field"><label>允许微信</label><select id="allowWechat"><option value="true" ${s.allow_wechat!==false?'selected':''}>允许</option><option value="false" ${s.allow_wechat===false?'selected':''}>禁止</option></select></div><div class="field"><label>允许 QQ</label><select id="allowQq"><option value="true" ${s.allow_qq!==false?'selected':''}>允许</option><option value="false" ${s.allow_qq===false?'selected':''}>禁止</option></select></div></div><div class="actions"><button class="btn" onclick="saveExtendedSettings()">保存 DPM 限制并下发</button><button class="btn secondary" onclick="childAction('request-location')">请求定位</button></div><div id="extendedSettingsMsg" class="muted"></div></div>`)};
async function saveExtendedSettings(){try{const hotspot=$('hotspot').value==='true',location=$('locationEnabled').value==='true',showApps=$('showAppManagement').value==='true',resetDisabled=$('resetDisabled').value==='true';const body={allowNewApps:$('allowNew').value==='true',locationEnabled:location,automaticLocationEnabled:$('autoLocation').value==='true',hotspotEnabled:hotspot,offlineMode:$('offlineMode').value,showAppManagement:showApps,resetDisabled,allowPhone:$('allowPhone').value==='true',allowWechat:$('allowWechat').value==='true',allowQq:$('allowQq').value==='true',offlineLockAfterDays:Number($('offlineLockAfterDays').value)||null,dpmRestrictions:{noConfigTethering:!hotspot,noConfigLocation:!location,noFactoryReset:resetDisabled,removeSettingsMenus:!showApps,allowAppManagement:showApps}};const j=await req(`/api/v1/admin/children/${selectedChild.child.childId}/app-settings`,{method:'PUT',body:JSON.stringify(body)});$('extendedSettingsMsg').textContent=`已保存，命令状态：${j.data.command?.status||'queued'}`;await openChild(selectedChild.child.childId)}catch(e){$('extendedSettingsMsg').textContent=e.message}}
async function openFamily(id){try{const j=await req('/api/v1/admin/families/'+id);const f=j.data;alert(`${f.familyName}\n家长：${f.phone}\n孩子：${(f.children||[]).map(c=>c.name).join('、')||'暂无'}`)}catch(e){alert(e.message)}}
async function loadLogs(){const j=await req('/api/v1/admin/logs');$('adminLogs').innerHTML=j.data?.length?`<table class="table"><thead><tr><th>时间</th><th>管理员</th><th>操作</th><th>详情</th></tr></thead><tbody>${j.data.map(x=>`<tr><td>${fmt(x.createdAt)}</td><td>${esc(x.username)}</td><td>${esc(x.action)}</td><td><div class="code">${esc(JSON.stringify(x.detail||{}))}</div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无操作日志</div>'}
async function loadVersion(){try{const j=await req('/api/v1/admin/system/version');versionInfo=j.data;$('versionPanel').innerHTML=`<div class="kvs">${kv('当前版本',versionInfo.currentVersion)}${kv('最新版本',versionInfo.latestVersion)}${kv('是否可更新',versionInfo.updateAvailable?'有新版本':'已是最新')}${kv('发布时间',fmt(versionInfo.publishedAt))}</div><h3>发布说明</h3><div class="code">${esc(versionInfo.releaseNotes||'暂无发布说明')}</div>${versionInfo.warning?`<div class="error">${esc(versionInfo.warning)}</div>`:''}`;const r=await req('/api/v1/admin/system/releases');$('releasesTable').innerHTML=r.data?.length?`<table class="table"><thead><tr><th>版本</th><th>发布时间</th><th>说明</th><th></th></tr></thead><tbody>${r.data.map(x=>`<tr><td>${esc(x.version)}</td><td>${fmt(x.publishedAt)}</td><td>${esc((x.releaseNotes||'').slice(0,160))}</td><td><button class="btn danger" onclick="rollback('${esc(x.version)}')">回滚到此版本</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无公开 Release</div>';const status=await req('/api/v1/admin/system/update/status');if(status.data?.status&&status.data.status!=='idle')$('updateMessage').innerHTML=`<div class="notice">更新状态：${esc(status.data.status)} ${esc(status.data.message||'')}</div>`}catch(e){$('versionPanel').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function requestUpdate(){try{const j=await req('/api/v1/admin/system/update',{method:'POST',body:JSON.stringify({version:'latest'})});$('updateMessage').innerHTML=`<div class="notice">更新已提交，状态：${esc(j.data.status)}。服务重启期间页面会短暂断开。</div>`;pollUpdate()}catch(e){$('updateMessage').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function rollback(version){if(!confirm(`确认回滚到 ${version}？`))return;try{const j=await req('/api/v1/admin/system/rollback',{method:'POST',body:JSON.stringify({version})});$('updateMessage').innerHTML=`<div class="notice">回滚已提交：${esc(j.data.version)}</div>`;pollUpdate()}catch(e){$('updateMessage').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function pollUpdate(){for(let i=0;i<30;i++){await new Promise(r=>setTimeout(r,3000));try{const j=await req('/api/v1/admin/system/update/status');$('updateMessage').innerHTML=`<div class="notice">更新状态：${esc(j.data.status||'unknown')} ${esc(j.data.message||'')}</div>`;if(['succeeded','failed','idle'].includes(j.data.status))break}catch{break}}}
function switchView(view){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+view));if(view==='families')loadFamilies();if(view==='devices')loadDevices();if(view==='version')loadVersion();if(view==='logs')loadLogs()}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>switchView(x.dataset.view));$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logoutBtn').onclick=()=>{token=null;localStorage.removeItem('guardian_admin_token');showLogin()};$('refreshBtn').onclick=loadOverview;$('reloadDevicesBtn').onclick=loadDevices;$('familySearchBtn').onclick=loadFamilies;$('familySearch').onkeydown=e=>{if(e.key==='Enter')loadFamilies()};$('checkVersionBtn').onclick=loadVersion;$('updateBtn').onclick=requestUpdate;$('reloadLogsBtn').onclick=loadLogs;
if(token){req('/api/v1/admin/auth/me').then(j=>{showApp();$('sessionUser').textContent=j.data.username;loadOverview()}).catch(()=>{token=null;localStorage.removeItem('guardian_admin_token');showLogin()})}else showLogin();
</script>
</body></html>
